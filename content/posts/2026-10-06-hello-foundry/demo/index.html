<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phyllotaxis demo</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #5f6368; --accent: #b4532a; --bg: #f4f3f0; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e4df; --muted: #9a9890; --accent: #e8875a; --bg: #1b1b1f; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: 1fr auto; }
  canvas { width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: .75rem; align-items: center; padding: .6rem .9rem; border-top: 1px solid rgb(128 128 128 / .25); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  output { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 5.5ch; text-align: right; }
</style>
</head>
<body>
<canvas id="c" aria-label="Phyllotaxis spiral"></canvas>
<div class="controls">
  <label for="angle">Divergence angle</label>
  <input id="angle" type="range" min="100" max="180" step="0.05" value="137.5">
  <output id="out">137.50°</output>
</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('angle');
  const out = document.getElementById('out');
  const N = 900;
  let angleDeg = Number(slider.value);
  let target = angleDeg;

  function accent() { return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const { clientWidth: w, clientHeight: h } = canvas;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw() {
    // Ease toward the slider so dragging feels smooth.
    angleDeg += (target - angleDeg) * 0.2;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cx = w / 2, cy = h / 2;
    const scale = Math.min(w, h) / (2 * Math.sqrt(N)) * 0.95;
    const a = angleDeg * Math.PI / 180;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = accent();
    for (let k = 0; k < N; k++) {
      const r = scale * Math.sqrt(k);
      const t = k * a;
      const x = cx + r * Math.cos(t), y = cy + r * Math.sin(t);
      const size = 1.2 + 2.2 * (k / N);
      ctx.globalAlpha = 0.35 + 0.65 * (k / N);
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (Math.abs(target - angleDeg) > 0.001) requestAnimationFrame(draw);
  }

  slider.addEventListener('input', () => {
    target = Number(slider.value);
    out.textContent = target.toFixed(2) + '°';
    requestAnimationFrame(draw);
  });
  new ResizeObserver(() => { resize(); draw(); }).observe(canvas);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  resize();
  draw();
</script>
</body>
</html>
